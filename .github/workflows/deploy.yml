name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build (package.json があればビルド)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          fi
      - name: Pick output directory
        id: out
        run: |
          DIR="."
          for d in dist build out; do
            if [ -d "$d" ]; then DIR="$d"; break; fi
          done
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ steps.out.outputs.dir }} --project-name=${{ secrets.CF_PROJECT_NAME }} --branch=main --commit-dirty=true